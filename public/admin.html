<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · CPAY</title>
<link rel="icon" type="image/svg+xml" href="/favicon-site.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<style>
.msg-bubble{padding:9px 12px;border-radius:10px;max-width:85%;background:var(--surface-2);border:1px solid var(--line)}
.msg-bubble.admin{background:var(--accent-soft);border-color:var(--accent-ring);margin-left:auto}
.msg-bubble.creator{margin-right:auto}
#threadList{min-height:180px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="theme.js"></script><script src="app.js"></script>
<script src="daily-desk.js"></script>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Sections">
    <a class="brand" href="/admin.html"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
    <button class="navi active" data-tab="home">Overview</button>
    <button class="navi" data-tab="daily">Daily earnings</button>
    <button class="navi" data-tab="people">Accounts</button>
    <button class="navi" data-tab="apps">Applications</button>
    <button class="navi" data-tab="payments">Payments</button>
    <button class="navi" data-tab="payouts">Payouts</button>
    <button class="navi" data-tab="links">Links</button>
    <button class="navi" data-tab="wallet">Wallet</button>
    <button class="navi" data-tab="settings">Settings</button>
    <button class="navi" data-tab="health">Health</button>
    <button class="navi" data-tab="system">System</button>
    <button class="navi" data-tab="audit">Audit</button>
    <button class="navi" data-tab="chat">Inbox</button>
    <button class="navi" id="logoutBtn">Log out</button>
  </aside>
  <main class="main">
    <div class="topbar"><div><div class="kicker">Admin</div><h2>CPAY admin</h2></div><div id="toast" role="status" style="display:none"></div></div>
    <section id="home"></section>
    <section id="daily" hidden></section>
    <section id="people" hidden></section>
    <section id="payments" hidden></section>
    <section id="payouts" hidden></section>
    <section id="links" hidden></section>
    <section id="wallet" hidden></section>
    <section id="settings" hidden>
      <div id="fees"></div>
      <div id="flags"></div>
      <div id="alerts"></div>
    </section>
    <section id="health" hidden></section>
    <section id="system" hidden></section>
    <section id="audit" hidden></section>
    <section id="chat" hidden></section>
    <section id="apps" hidden></section>
  </main>
</div>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('cpay-admin-tab'); } catch (e) {}
  if (!t && location.hash) t = location.hash.replace('#', '');
  if (!t) return;
  document.querySelectorAll('main > section').forEach(function (s) { s.hidden = s.id !== t; });
  document.querySelectorAll('.navi[data-tab]').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
})();
</script>
<div id="opsGateSummary" hidden></div>
<div id="opsGateList" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="admin-wallet.js?v=14"></script>
<script src="admin-wallet-route.js?v=14"></script>
<script src="admin-desk.js?v=14"></script>
<script src="admin-unify.js?v=14"></script>
<script src="admin-ops-rest.js?v=14"></script>
<script src="admin-home-live.js?v=14"></script>
</body>
</html>
