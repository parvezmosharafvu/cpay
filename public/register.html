<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<meta name="color-scheme" content="light">
<title>Create account · CPAY</title>
<link rel="icon" type="image/svg+xml" href="/favicon-site.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<link rel="stylesheet" href="a11y.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="theme.js"></script><script src="app.js"></script><script src="turnstile.js"></script>
</head>
<body class="auth">
  <a class="skip-link" href="#registerCard">Skip to form</a>
  <main class="auth-card">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
    <div class="card" id="registerCard">
      <h1>Open a CPAY account</h1>
      <p class="sub">A freelancer account: payment links, a storefront, and USDT payouts.</p>
      <div class="field"><label for="displayName">Display name</label><input id="displayName" autocomplete="name"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" aria-describedby="passwordHint" placeholder="At least 8 characters" minlength="8" required></div>
      <p class="hint" id="passwordHint">At least 8 characters.</p>
      <button class="btn primary block lg" id="submitBtn" type="button">Create account</button>
      <div class="alert alert-danger" id="errorMsg" role="alert" hidden></div>
      <div class="alert alert-success" id="successMsg" role="status" hidden></div>
    </div>
    <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
  </main>
<script>
document.getElementById('submitBtn').onclick = async () => {
  const displayName = document.getElementById('displayName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errorMsg'); const ok = document.getElementById('successMsg');
  err.hidden = ok.hidden = true;
  if (!email || !password){ err.textContent='Email and password required.'; err.hidden=false; return; }
  if (password.length < 8){ err.textContent='Use at least 8 characters.'; err.hidden=false; return; }
  const btn = document.getElementById('submitBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  let data, error;
  try {
    // Optional Turnstile (off unless CPAY_TURNSTILE_SITE_KEY is set); the
    // token goes to Supabase Auth, which verifies it when captcha is enabled.
    let captchaToken = null;
    try { captchaToken = window.cpayTurnstileToken ? await window.cpayTurnstileToken('register') : null; }
    catch (te) { err.textContent = te.message || 'Verification failed. Try again.'; err.hidden = false; btn.disabled = false; return; }
    ({ data, error } = await window.supabaseClient.auth.signUp({
      email, password,
      options: {
        data: { display_name: displayName || undefined, requested_role: 'freelancer' },
        ...(captchaToken ? { captchaToken } : {}),
      }
    }));
  } catch (e) {
    error = { message: 'Could not reach the server. Check your connection and try again.' };
  }
  if (error){ err.textContent=error.message; err.hidden=false; btn.disabled=false; return; }
  if (data.session){ location.href = 'dashboard.html'; return; }
  ok.textContent = 'Application received. Confirm your email. An admin then approves the account, unless auto-approval is on.';
  ok.hidden=false;
};
window.addEventListener('DOMContentLoaded', () => { if (window.applyDomainTheme) applyDomainTheme(); });
</script>
</body></html>
