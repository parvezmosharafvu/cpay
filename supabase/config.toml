# CPAY — Supabase CLI / GitHub integration config
#
# Without this file the GitHub integration reports "No functions to deploy"
# even though supabase/functions/ has five of them, because it has nothing
# telling it they exist.
#
# The verify_jwt values below are NOT optional. The default is true, and
# these functions are called by clients that cannot present a Supabase
# JWT:
#
#   create-invoice  — paying customers have no account. Abuse is capped by
#                     a per-link rate limit inside the function.
#   daily-report,
#   ledger-backup,
#   telegram-notify — called by pg_cron with an x-cron-secret header.
#                     All fail closed if CRON_SECRET is unset.
#
# user-withdraw is always called by a signed-in creator, and admin-actions
# and auth-settings by a signed-in admin (the admin role is checked again in
# code), so all three keep JWT verification ON.
#
# If you ever let the integration deploy functions WITHOUT this file, all
# five get verify_jwt = true and every payment on the site starts failing
# with 401.

project_id = "riumaeihemgznvgattoc"

[functions.admin-actions]
verify_jwt = true

[functions.create-invoice]
verify_jwt = false

[functions.user-withdraw]
verify_jwt = true

# Admin-only switch for sign-up email confirmation. Holds the Supabase
# personal access token (CPAY_SUPABASE_ACCESS_TOKEN secret), so it must
# never be reachable without a signed-in admin.
[functions.auth-settings]
verify_jwt = true

# Admin → Settings: secrets (write-only) and Cloudflare. Signed-in admin at
# aal2 only; the admin role and a fresh sign-in are checked again in code.
[functions.owner-config]
verify_jwt = true

# Admin → System guide: the owner only (CPAY_OWNER_USER_ID), passkey session;
# checked again in code.
[functions.owner-guide]
verify_jwt = true

[functions.daily-report]
verify_jwt = false

[functions.ledger-backup]
verify_jwt = false

# Health monitor. Called by pg_cron, and optionally by an external uptime
# monitor pointed at the same URL with the same header. Returns 503 when
# something is wrong so a monitor can page on the status code alone.
[functions.health]
verify_jwt = false

# Social-media crawlers cannot present a JWT, and this endpoint only ever
# returns a picture built from a public display name.
[functions.og-image]
verify_jwt = false

# Sends the Telegram messages migration 0106 queues (settled payments and
# the 17:00 Dhaka daily close). Called by pg_cron with x-cron-secret, like
# daily-report; it refuses every request without it.
[functions.telegram-notify]
verify_jwt = false

# Direct settlement (20261018010000, off until the owner turns it on).
# direct-invoice is called by payers, who have no account, exactly like
# create-invoice: the gateway JWT check is off and the function defends
# itself (operator stop, switch, Turnstile, per-address/link/owner limits).
[functions.direct-invoice]
verify_jwt = false

# Signed-in Freelancers only: check, save or remove their own Lightning
# address (save and remove also need a fresh sign-in, checked in code).
[functions.settlement-destination]
verify_jwt = true

# Breez Spark wallet (supabase/functions/breez-wallet/README.md). Callers are
# Edge Functions with an HMAC-signed request and pg_cron with x-cron-secret;
# it refuses everything else, so the gateway JWT check is off.
[functions.breez-wallet]
verify_jwt = false
# Too large for the GitHub integration / Preview upload (413 'request entity
# too large': the Breez WASM). Deployed by hand with the CLI instead:
#   scripts/deploy-breez-wallet.sh <project-ref>
enabled = false

# ── Auth: passkey + email only (owner decision 2026-10-21) ─────────────────
# Kept COMMENTED on purpose. An [auth] section here is pushed by
# `supabase config push` (and used for preview branches), and every key
# left out falls back to the CLI default (site_url = localhost, etc.), which
# would break production sign-in. Apply these four changes in the dashboard
# (or uncomment together with the full current [auth] block) at deploy time,
# AFTER every active admin has signed in with a passkey:
#
# [auth.email]
# enable_signup = true
# enable_confirmations = true      # sign-up needs the email link (live: already on)
#
# Passkeys stay on (Authentication → Passkeys; live: ON).

# Authenticator codes are retired (2026-10-21, after the owner confirmed
# passkey admin sign-in). Pushed with `supabase config push`, which leaves
# undeclared auth properties unchanged. Existing factors are not deleted;
# strong_session() still accepts an aal2 session, which can no longer be
# reached with a code.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
