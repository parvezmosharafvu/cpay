name: simplify-admin-wallet
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wallet route and hide unused admin chrome
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('public/admin-wallet.js')
          t = p.read_text()
          t = t.replace("const WALLET_FN = 'admin-actions/admin-wallet';", "const WALLET_FN = 'admin-actions';")
          old = '''    <div class="grid split">
      <div class="card">
        <h3>Receive</h3>'''
          # drop Receive + Send cards; keep USDT withdraw + history
          start = t.find('    <div class="grid split">')
          end = t.find('    <div class="withdraw">')
          if start < 0 or end < 0:
              raise SystemExit('wallet shell split block missing')
          t = t[:start] + t[end:]
          p.write_text(t)
          print('admin-wallet.js', p.stat().st_size)

          h = Path('public/admin.html')
          ht = h.read_text()
          ht = ht.replace('    <button class="navi" data-tab="apps">Applications</button>\n', '')
          h.write_text(ht)

          c = Path('public/admin-classic.html')
          ct = c.read_text()
          ct = ct.replace('''                      <!-- Calculated Node Balance -->
                      <div class="stat-card">
                        <div class="stat-label">Calculated Node Balance</div>
                        <div class="stat-val amber" id="statNodeUsd">$0.00</div>
                        <div class="stat-sub" style="font-family:var(--mono);">Settled + Profit Margin</div>
                      </div>''',
                          '''                      <div class="stat-card" id="statNodeUsd" hidden></div>''')
          ct = ct.replace('<button class="tab-btn" data-tab="applications" onclick="switchTab(\'applications\', this)">Applications <span class="tab-badge" id="applicationBadge">0</span></button>', '')
          c.write_text(ct)
          print('classic patched', 'applications' in ct.lower())

          a = Path('supabase/functions/admin-actions/index.ts')
          at = a.read_text()
          needle = '    if (req.method !== "POST") return json({ error: "Method not allowed" }, 405, cors);\n    const url = new URL(req.url);'
          insert = '''    if (req.method !== "POST") return json({ error: "Method not allowed" }, 405, cors);\n    const url = new URL(req.url);\n    let body: Record<string, unknown> = {};\n    try { body = await req.json(); } catch { body = {}; }'''
          if needle not in at:
              raise SystemExit('admin-actions header missing')
          at = at.replace(needle, insert, 1)
          at = at.replace('            const { paymentId, amountSettled } = await req.json();',
                          '            const paymentId = body.paymentId;\n            const amountSettled = body.amountSettled;')
          at = at.replace('            const { withdrawalId, action } = await req.json();',
                          '            const withdrawalId = body.withdrawalId;\n            const action = body.action;')
          at = at.replace('    if (url.pathname.endsWith("/admin-wallet")) {\n        const auth = await verifyAdminCaller(req);\n        if (!auth.ok) return json({ error: "Unauthorized" }, 401, cors);\n        let body: Record<string, unknown>;\n        try { body = await req.json(); } catch { return json({ error: "Invalid JSON body" }, 400, cors); }',
                          '    if (url.pathname.endsWith("/admin-wallet") || WALLET_ACTIONS[String(body.action ?? "")]) {\n        const auth = await verifyAdminCaller(req);\n        if (!auth.ok) return json({ error: "Unauthorized" }, 401, cors);')
          a.write_text(at)
          print('admin-actions patched')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin-wallet.js public/admin.html public/admin-classic.html supabase/functions/admin-actions/index.ts
          git status
          git diff --cached --stat
          git commit -m "Fix admin wallet Edge Function route; hide Applications and node-balance chrome"
          git push
