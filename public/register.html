<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · CPAY</title>
<link rel="icon" type="image/svg+xml" href="/favicon-site.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<link rel="stylesheet" href="a11y.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="theme.js"></script><script src="app.js"></script>
</head>
<body class="auth">
  <main class="auth-card">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
    <div class="card">
      <h1>Open a CPAY account</h1>
      <p class="sub">A freelancer account: payment links, a dashboard and USDT withdrawals.</p>
      <div class="field"><label for="displayName">Display name</label><input id="displayName" autocomplete="name"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" aria-describedby="passwordHint" placeholder="At least 8 characters"></div>
      <p class="faint" id="passwordHint">At least 8 characters.</p>
      <button class="btn primary block lg" id="submitBtn" type="button">Create account</button>
      <p class="err" id="errorMsg" role="alert" style="display:none;margin-top:12px"></p>
      <p class="ok" id="successMsg" role="status" style="display:none;margin-top:12px"></p>
    </div>
    <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
  </main>
<script>
document.getElementById('submitBtn').onclick = async () => {
  const displayName = document.getElementById('displayName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errorMsg'); const ok = document.getElementById('successMsg');
  err.style.display=ok.style.display='none';
  if (!email || !password){ err.textContent='Email and password required.'; err.style.display='block'; return; }
  if (password.length < 8){ err.textContent='Use at least 8 characters.'; err.style.display='block'; return; }
  const btn = document.getElementById('submitBtn'); btn.disabled = true;
  const { data, error } = await window.supabaseClient.auth.signUp({
    email, password,
    options: { data: { display_name: displayName || undefined, requested_role: 'freelancer' } }
  });
  if (error){ err.textContent=error.message; err.style.display='block'; btn.disabled=false; return; }
  if (data.session){ location.href = 'dashboard.html'; return; }
  ok.textContent = 'Application received. Confirm your email. An admin then approves the account, unless auto-approval is on.';
  ok.style.display='block';
};
window.addEventListener('DOMContentLoaded', () => { if (window.applyDomainTheme) applyDomainTheme(); });
</script>
</body></html>
