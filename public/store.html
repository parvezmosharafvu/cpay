<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="color-scheme" content="light">
<meta name="description" content="CPAY storefront">
<title>CPAY Store</title>
<link rel="icon" href="/favicon-site.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<link rel="stylesheet" href="a11y.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
</head>
<body class="store">
<a class="skip-link" href="#grid">Skip to payment options</a>
<main class="wrap store-wrap">
  <nav class="nav" aria-label="Store"><a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a></nav>
  <section class="store-hero" aria-live="polite">
    <div class="merchant-avatar skeleton avatar" id="avatar" aria-hidden="true"></div>
    <h1 id="name"><span class="skeleton line lg sk-name">&nbsp;</span></h1>
    <p id="tagline"><span class="skeleton line sk-tagline">&nbsp;</span></p>
    <p id="bio" class="faint"></p>
    <button id="share" class="btn ghost store-share" type="button" hidden>Share store</button>
  </section>
  <div class="store-tools" id="store-tools" hidden>
    <label for="store-search">Find a payment option</label>
    <input id="store-search" type="search" placeholder="Search by name or link" autocomplete="off">
    <p id="store-count" class="faint" role="status"></p>
  </div>
  <p id="share-status" class="faint" role="status"></p>
  <section id="grid" class="store-grid" aria-label="Payment options"></section>
  <div id="state" class="store-empty" role="status">Loading storefront…</div>
  <button id="store-retry" type="button" class="btn ghost" hidden>Try again</button>
  <footer class="site store-foot">Powered by CPAY</footer>
</main>
<script>
const sb=window.supabaseClient,params=new URLSearchParams(location.search),uid=params.get('u');
const [avatar,name,tagline,bio,share,grid,state]=['avatar','name','tagline','bio','share','grid','state'].map(id=>document.getElementById(id));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const retry=document.getElementById('store-retry');
retry.onclick=loadStore;
async function loadStore(){
  retry.hidden=true;
  state.textContent='Loading storefront…';
  let timer;
  try{
  if(!uid){useNavyState();state.textContent='Store not found.';avatar.classList.remove('skeleton','avatar');avatar.textContent='?';name.textContent='Store not found';tagline.textContent='';return}
  const {data,error}=await Promise.race([sb.rpc('get_public_store',{p_user_id:uid}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('Store read timed out')),15000)})]);
  if(error)throw error;
  if(error||!data?.length){useNavyState();state.textContent='Store not found or unavailable.';avatar.classList.remove('skeleton','avatar');avatar.textContent='?';name.textContent='Unavailable';tagline.textContent='';return}
  const r=data[0];
  document.title=(r.display_name||'CPAY freelancer')+' · CPAY';
  // Apply design before paint of content so the page colour does not flash.
  setDesign(r.theme||'midnight');
  if(/^#[0-9a-f]{6}$/i.test(r.accent||''))document.documentElement.style.setProperty('--merchant-accent',r.accent);
  avatar.classList.remove('skeleton','avatar');
  name.textContent=r.display_name||'CPAY freelancer';
  tagline.textContent=r.tagline||'Choose a payment option';
  bio.textContent=r.bio||'';bio.style.display=r.bio?'block':'none';
  if(r.avatar_url){const img=document.createElement('img');img.src=r.avatar_url;img.alt=r.display_name||'Freelancer';avatar.textContent='';avatar.appendChild(img);}
  else avatar.textContent=(r.display_name||'$').trim().charAt(0).toUpperCase()||'$';
  const links=Array.isArray(r.links)?r.links:[];
  state.style.display='none';
  const search=document.getElementById('store-search');
  document.getElementById('store-tools').hidden=false;
  const renderLinks=()=>{
    const query=search.value.trim().toLowerCase();
    const found=links.filter(l=>String(l.display_name||'').toLowerCase().includes(query)||String(l.slug||'').toLowerCase().includes(query));
    document.getElementById('store-count').textContent=found.length+' / '+links.length+' payment options';
    grid.innerHTML=found.map(l=>`<article class="card"><h3>${esc(l.display_name||l.slug)}</h3><div class="faint mono">/${esc(l.slug)}</div><a class="btn primary block" href="/${encodeURIComponent(l.slug)}">${esc(r.cta||'Pay now')}</a></article>`).join('');
    state.style.display=found.length?'none':'block';
    state.textContent=links.length?'No matching payment options. Try another search.':'No active payment links yet.';
  };
  search.oninput=renderLinks;renderLinks();
  share.hidden=false;
  share.onclick=async()=>{
    if(share.disabled)return;
    share.disabled=true;
    const status=document.getElementById('share-status');status.textContent='';
    try{
      if(navigator.share){try{await navigator.share({title:r.display_name||'CPAY Store',text:r.tagline||'Payment options',url:location.href});return}catch(e){if(e.name==='AbortError')return}}
      await navigator.clipboard.writeText(location.href);status.textContent='Store link copied';
    }catch{status.textContent='Copy the store link from your address bar.'}
    finally{share.disabled=false}
  };
  }catch{
    useNavyState();avatar.classList.remove('skeleton','avatar');avatar.textContent='?';
    name.textContent='Store unavailable';tagline.textContent='';
    state.style.display='block';state.textContent='Could not load this store. Try again.';retry.hidden=false;
  }finally{clearTimeout(timer)}
}
loadStore();
</script>
</body>
</html>
