# CPAY — Supabase CLI / GitHub integration config
#
# Without this file the GitHub integration reports "No functions to deploy"
# even though supabase/functions/ has five of them, because it has nothing
# telling it they exist.
#
# The verify_jwt values below are NOT optional. The default is true, and
# these functions are called by clients that cannot present a Supabase
# JWT:
#
#   create-invoice  — paying customers have no account. Abuse is capped by
#                     a per-link rate limit inside the function.
#   daily-report,
#   ledger-backup,
#   telegram-notify — called by pg_cron with an x-cron-secret header.
#                     All fail closed if CRON_SECRET is unset.
#
# user-withdraw is always called by a signed-in creator, and admin-actions
# and auth-settings by a signed-in admin (the admin role is checked again in
# code), so all three keep JWT verification ON.
#
# If you ever let the integration deploy functions WITHOUT this file, all
# five get verify_jwt = true and every payment on the site starts failing
# with 401.

project_id = "riumaeihemgznvgattoc"

[functions.admin-actions]
verify_jwt = true

[functions.create-invoice]
verify_jwt = false

[functions.user-withdraw]
verify_jwt = true

# Admin-only switch for sign-up email confirmation. Holds the Supabase
# personal access token (CPAY_SUPABASE_ACCESS_TOKEN secret), so it must
# never be reachable without a signed-in admin.
[functions.auth-settings]
verify_jwt = true

[functions.daily-report]
verify_jwt = false

[functions.ledger-backup]
verify_jwt = false

# Health monitor. Called by pg_cron, and optionally by an external uptime
# monitor pointed at the same URL with the same header. Returns 503 when
# something is wrong so a monitor can page on the status code alone.
[functions.health]
verify_jwt = false

# Social-media crawlers cannot present a JWT, and this endpoint only ever
# returns a picture built from a public display name.
[functions.og-image]
verify_jwt = false

# Sends the Telegram messages migration 0102 queues (settled payments and
# the 17:00 Dhaka daily close). Called by pg_cron with x-cron-secret, like
# daily-report; it refuses every request without it.
[functions.telegram-notify]
verify_jwt = false
