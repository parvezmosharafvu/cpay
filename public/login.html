<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · CPAY</title>
<link rel="icon" type="image/svg+xml" href="/favicon-site.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<style>
  .auth :focus-visible{outline:2px solid var(--brand,#635bff);outline-offset:2px}
  .auth .btn,.auth input{min-height:44px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="theme.js"></script><script src="app.js"></script>
</head>
<body class="auth">
  <main class="auth-card">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
    <div class="card">
      <h1>Log in</h1>
      <p class="sub">Welcome back. Enter your email and password.</p>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
      <button class="btn primary block lg" id="submitBtn" type="button">Log in</button>
      <p class="foot" style="margin-top:12px"><button class="btn ghost block" id="forgotBtn" type="button">Forgot password?</button></p>
      <p class="err" id="errorMsg" role="alert" style="display:none;margin-top:12px"></p>
      <p class="faint" id="okMsg" role="status" style="display:none;margin-top:12px"></p>
    </div>
    <p class="foot">No account? <a href="register.html">Create one</a></p>
  </main>
<script>
const errEl = () => document.getElementById('errorMsg');
const okEl = () => document.getElementById('okMsg');
function showErr(t){ const e=errEl(); e.textContent=t; e.style.display='block'; okEl().style.display='none'; }
function showOk(t){ const o=okEl(); o.textContent=t; o.style.display='block'; errEl().style.display='none'; }
async function go(id){
  const { data } = await window.supabaseClient.from('profiles').select('role,account_status').eq('id', id).single();
  if (data?.account_status && data.account_status !== 'active'){
    await window.supabaseClient.auth.signOut();
    const labels = {pending:'Waiting for admin approval.', rejected:'Application was not approved.', suspended:'Account suspended.'};
    showErr(labels[data.account_status] || 'Account is not active.');
    const btn = document.getElementById('submitBtn'); if (btn) btn.disabled = false;
    return;
  }
  location.href = roleHome(data?.role);
}
document.getElementById('submitBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  errEl().style.display='none'; okEl().style.display='none';
  if (!email || !password){ showErr('Enter email and password.'); return; }
  const btn = document.getElementById('submitBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if (error){ showErr(error.message); btn.disabled=false; return; }
    await go(data.user.id);
  } catch (e) {
    showErr('Could not reach the server. Check your connection and try again.');
    btn.disabled = false;
  }
};
document.getElementById('forgotBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if (!email){ showErr('Enter your email first, then tap Forgot password.'); return; }
  const btn = document.getElementById('forgotBtn'); btn.disabled = true;
  let error;
  try {
    ({ error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: `${location.origin}/reset.html`,
    }));
  } catch (e) {
    error = { message: 'Could not reach the server. Check your connection and try again.' };
  } finally {
    btn.disabled = false;
  }
  if (error){ showErr(error.message); return; }
  showOk('Check your email for a reset link. It opens this site so you can set a new password.');
};
document.getElementById('password').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('submitBtn').click(); });
window.addEventListener('DOMContentLoaded', async () => {
  if (window.applyDomainTheme) await applyDomainTheme();
  const { data:{ session } } = await window.supabaseClient.auth.getSession();
  if (session) await go(session.user.id);
});
</script>
</body>
</html>
