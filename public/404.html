<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <title>CPAY — Pay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-payment.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cpay.css">

    <!-- These three are this page's contract with the rest of the system.
         Drop any one and the page fails silently:
           supabase-js — the client used for get_link_preview
           config.js   — defines window.SUPABASE_URL and window.supabaseClient
           theme.js    — defines applyDomainTheme(), awaited on load -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="theme.js"></script>

  </head>
  <body class="checkout">

    <header class="checkout-head">
      <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
      <span class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure payment</span>
    </header>

    <!-- LOADING -->
    <div class="checkout-card state-panel" id="loadingState">
      <div class="spinner"></div>
      <div class="state-sub">Loading payment page…</div>
    </div>

    <!-- NOT FOUND -->
    <div class="checkout-card state-panel" id="notFoundCard" style="display:none;">
      <div class="state-mark">404</div>
      <div class="state-title">Payment link not found</div>
      <div class="state-sub">This payment link doesn't exist, or its owner has turned it off.</div>
    </div>

    <!-- PAYMENT PAGE -->
    <main class="checkout-card" id="paymentCard" style="display:none; flex-direction:column;">

      <!-- Who is being paid, stated plainly before any amount is typed.
           The payer arrived from a shared link and may have no idea who
           is on the other end. -->
      <div class="merchant" aria-label="Merchant">
        <div class="merchant-avatar" id="merchantAvatar">$</div>
        <div>
          <div class="merchant-label">You are paying</div>
          <div class="merchant-name" id="merchantName">&nbsp;</div>
        </div>
      </div>

      <div class="amount-display" role="status" aria-live="polite" aria-atomic="true">
        <div class="amount-text" id="amountDisplay">$0</div>
        <div class="charge-summary" id="chargeSummary" aria-live="polite"></div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-key="1" aria-label="1 dollar">1</button>
        <button class="key" data-key="2" aria-label="2 dollars">2</button>
        <button class="key" data-key="3" aria-label="3 dollars">3</button>
        <button class="key" data-key="4" aria-label="4 dollars">4</button>
        <button class="key" data-key="5" aria-label="5 dollars">5</button>
        <button class="key" data-key="6" aria-label="6 dollars">6</button>
        <button class="key" data-key="7" aria-label="7 dollars">7</button>
        <button class="key" data-key="8" aria-label="8 dollars">8</button>
        <button class="key" data-key="9" aria-label="9 dollars">9</button>
        <button class="key" data-key="." aria-label="Decimal point">.</button>
        <button class="key" data-key="0" aria-label="0 dollars">0</button>
        <button class="key key-backspace" data-key="back" aria-label="Backspace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- CLASSIC layout: an amount field and preset chips instead of the
           keypad. Same handlers, same amountStr. -->
      <div class="classic-body" id="classicBody">
        <label class="classic-label" for="classicInput">Amount</label>
        <div class="classic-inputwrap">
          <span class="classic-dollar">$</span>
          <input type="text" inputmode="decimal" id="classicInput" placeholder="0.00" autocomplete="off" aria-label="Payment amount">
        </div>
        <div class="classic-label">Quick amounts</div>
        <div class="classic-chips" id="classicChips">
          <button class="classic-chip" data-amount="10" aria-label="Set amount to 10 dollars">$10</button>
          <button class="classic-chip" data-amount="20" aria-label="Set amount to 20 dollars">$20</button>
          <button class="classic-chip" data-amount="50" aria-label="Set amount to 50 dollars">$50</button>
        </div>
        <div class="classic-chips classic-more" id="classicMore" style="display:none;">
          <button class="classic-chip" data-amount="100" aria-label="Set amount to 100 dollars">$100</button>
          <button class="classic-chip" data-amount="200" aria-label="Set amount to 200 dollars">$200</button>
          <button class="classic-chip" data-amount="500" aria-label="Set amount to 500 dollars">$500</button>
        </div>
        <button class="classic-toggle" id="classicToggle" aria-expanded="false" aria-controls="classicMore">Show more amounts</button>
      </div>

      <div class="action-section">
        <div class="quick-amounts" id="quickAmounts">
          <button class="quick-chip" data-amount="10" aria-label="Set amount to 10 dollars">$10</button>
          <button class="quick-chip" data-amount="25" aria-label="Set amount to 25 dollars">$25</button>
          <button class="quick-chip" data-amount="50" aria-label="Set amount to 50 dollars">$50</button>
          <button class="quick-chip" data-amount="100" aria-label="Set amount to 100 dollars">$100</button>
          <button class="quick-chip" data-amount="200" aria-label="Set amount to 200 dollars">$200</button>
        </div>
        <button class="quick-btn" id="quickToggle" aria-expanded="false" aria-controls="quickAmounts">Quick amounts</button>

        <div class="status-msg" id="statusMsg" role="status" aria-live="polite"></div>

        <div id="walletHint">Pay with Cash App or any Lightning wallet</div>
        <button class="pay-btn" id="payBtn" type="button">
          <div class="btn-spinner" aria-hidden="true"></div>
          <span id="payBtnText">Continue to payment</span>
        </button>
      </div>
    </main>

    <p class="checkout-foot">Payments are sent over the Bitcoin Lightning Network.</p>

    <script>
// Kept in sync with validate_link_slug() in the database and the RESERVED
// set in worker/og-preview-worker.js. Matched case-insensitively, because
// /Admin has to be refused as firmly as /admin.
const RESERVED = ['index','login','register','dashboard','admin','404','config','theme',
  'assets','favicon','invoice-cpay-v2','api','u','static','public',
  'well-known','robots','sitemap','moderator','reseller','store','classic'];

// NOT lowercased. /taylor-james, /TaylorJames and /taylorjames are three
// separate links that can carry three different rates, so the slug has
// to reach the server exactly as it was typed.
const slug = window.location.pathname.replace(/^\/|\/$/g, '');

const MIN_AMOUNT = 1;
const MAX_AMOUNT = 5000;

// Held as a string, not a number, so a trailing "." or "50." survives
// while the customer is still typing.
let amountStr = '';
let linkCostPercent = 0;

function el(id){ return document.getElementById(id); }

function showNotFound(){
  el('loadingState').style.display = 'none';
  el('paymentCard').style.display = 'none';
  el('notFoundCard').style.display = 'flex';
}

function showPaymentCard(){
  el('loadingState').style.display = 'none';
  el('notFoundCard').style.display = 'none';
  el('paymentCard').style.display = 'flex';
}

function currentAmount(){
  const n = parseFloat(amountStr);
  return Number.isFinite(n) ? n : 0;
}

function renderAmount(){
  const shown = '$' + (amountStr === '' ? '0' : amountStr);
  const display = el('amountDisplay');
  display.textContent = shown;
  display.classList.toggle('long', shown.length > 8);

  // The classic layout types into a field instead of the keypad, but both
  // read and write the same amountStr — so switching layout never changes
  // what gets sent, only how it is entered.
  const ci = el('classicInput');
  if (ci && document.activeElement !== ci) ci.value = amountStr;
  document.querySelectorAll('.classic-chip').forEach(c => {
    c.classList.toggle('selected', amountStr !== '' && parseFloat(c.dataset.amount) === currentAmount());
  });

  const amt = currentAmount();
  document.querySelectorAll('.quick-chip').forEach(c => {
    c.classList.toggle('selected', amountStr !== '' && parseFloat(c.dataset.amount) === amt);
  });

  const summary = el('chargeSummary');
  if (summary) {
    if (amt > 0) {
      const charged = Math.round(amt * (1 + linkCostPercent / 100) * 100) / 100;
      summary.textContent = linkCostPercent > 0
        ? `You pay $${charged.toFixed(2)} · includes ${linkCostPercent}% service fee`
        : `You pay $${charged.toFixed(2)}`;
      summary.classList.add('visible');
    } else {
      summary.textContent = '';
      summary.classList.remove('visible');
    }
  }
}

function pressKey(k){
  clearStatus();

  if (k === 'back'){
    amountStr = amountStr.slice(0, -1);
    renderAmount();
    return;
  }

  if (k === '.'){
    if (amountStr.includes('.')) return;
    amountStr = (amountStr === '' ? '0' : amountStr) + '.';
    renderAmount();
    return;
  }

  // Every rule the server enforces is applied here as well, so the display
  // can never show an amount create-invoice would turn around and reject.
  const parts = amountStr.split('.');
  if (parts.length === 2 && parts[1].length >= 2) return;  // cents only
  if (amountStr === '0') amountStr = '';                    // no leading zero

  const next = amountStr + k;
  if (parseFloat(next) > MAX_AMOUNT) return;
  if (next.replace('.', '').length > 8) return;

  amountStr = next;
  renderAmount();
}

function setStatus(text, kind){
  const s = el('statusMsg');
  s.textContent = text;
  s.className = 'status-msg ' + (kind || '');
  s.style.display = 'block';
}

function clearStatus(){
  const s = el('statusMsg');
  s.style.display = 'none';
  s.textContent = '';
}

function setPaying(isPaying, label){
  const btn = el('payBtn');
  btn.disabled = isPaying;
  btn.classList.toggle('loading', isPaying);
  el('payBtnText').textContent = label;
}

window.addEventListener('DOMContentLoaded', async () => {
  // Resolves the domain's default design. A link's own design below
  // overrides it.
  await applyDomainTheme();

  if (!slug || RESERVED.includes(slug.toLowerCase()) || slug.includes('.') || slug.includes('/')){
    showNotFound();
    return;
  }

  try {
    const { data, error } = await window.supabaseClient.rpc('get_link_preview', { p_slug: slug });
    const row = Array.isArray(data) ? data[0] : data;
    if (error || !row || row.is_active === false){
      showNotFound();
      return;
    }

    const name = row.display_name || slug;
    linkCostPercent = Number(row.cost_percent || 0);
    // A link-specific design overrides its domain default; NULL keeps the
    // domain layout inherited for existing links.
    applyLinkTheme(row.theme);
    // The invoice page follows the link's design unless the link picked a
    // separate invoice design. It travels in the URL so a refresh keeps it.
    window.CPAY_INVOICE_DESIGN = invoiceDesignFor(row.invoice_theme, window.CPAY_LAYOUT);
    window.CPAY_WALLET_MODE = row.wallet_mode || 'all_wallets';
    document.documentElement.setAttribute('data-wallet', window.CPAY_WALLET_MODE);
    const walletHint = document.getElementById('walletHint');
    if (walletHint) {
      walletHint.textContent = window.CPAY_WALLET_MODE === 'cashapp'
        ? 'Pay with Cash App'
        : 'Pay with Cash App or any Lightning wallet';
    }
    // textContent, never innerHTML: display_name is free text a creator
    // chose, and this page is served to the public.
    el('merchantName').textContent = name;
    el('merchantAvatar').textContent = ([...name][0] || '$');
    document.title = 'Pay ' + name + ' — CPAY';

    showPaymentCard();
    renderAmount();
  } catch (e){
    console.error('link lookup failed:', e);
    showNotFound();
    return;
  }

  el('keypad').addEventListener('click', (e) => {
    const btn = e.target.closest('.key');
    if (btn) pressKey(btn.dataset.key);
  });

  el('quickToggle').addEventListener('click', () => {
    const open = el('quickAmounts').classList.toggle('visible');
    el('quickToggle').setAttribute('aria-expanded', String(open));
  });

  el('quickAmounts').addEventListener('click', (e) => {
    const chip = e.target.closest('.quick-chip');
    if (!chip) return;
    amountStr = chip.dataset.amount;
    clearStatus();
    renderAmount();
  });

  el('payBtn').addEventListener('click', startPayment);

  // Classic layout inputs. Present in every layout's DOM but only visible
  // in one, so wiring them unconditionally is safe.
  el('classicInput').addEventListener('input', (e) => {
    // Same rules as the keypad, applied to typed text: digits, one dot,
    // two decimals, capped at MAX_AMOUNT.
    let v = e.target.value.replace(/[^0-9.]/g, '');
    const parts = v.split('.');
    if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
    if (parts[1] !== undefined) v = parts[0] + '.' + parts[1].slice(0, 2);
    if (v !== '' && parseFloat(v) > MAX_AMOUNT) v = amountStr;
    amountStr = v;
    e.target.value = v;
    clearStatus();
    renderAmount();
  });

  el('classicChips').addEventListener('click', pickChip);
  el('classicMore').addEventListener('click', pickChip);
  el('classicToggle').addEventListener('click', () => {
    const more = el('classicMore');
    const open = more.style.display !== 'none';
    more.style.display = open ? 'none' : 'flex';
    el('classicToggle').setAttribute('aria-expanded', String(!open));
    el('classicToggle').textContent = open ? 'Show more amounts' : 'Show fewer amounts';
  });

  // Physical keyboards, for anyone paying from a desktop.
  document.addEventListener('keydown', (e) => {
    if (el('paymentCard').style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    else if (e.key === '.') pressKey('.');
    else if (e.key === 'Backspace') pressKey('back');
    else if (e.key === 'Enter') startPayment();
  });
});

function pickChip(e){
  const chip = e.target.closest('.classic-chip');
  if (!chip) return;
  amountStr = chip.dataset.amount;
  clearStatus();
  renderAmount();
}

async function startPayment(){
  // Keyboard Enter can fire while the first request is still in flight.
  // The button state is the single client-side idempotency guard.
  if (el('payBtn').disabled) return;
  const amount = currentAmount();
  clearStatus();

  if (!amount || amount < MIN_AMOUNT || amount > MAX_AMOUNT){
    setStatus('Enter an amount between $' + MIN_AMOUNT + ' and $' + MAX_AMOUNT.toLocaleString() + '.', 'err');
    return;
  }

  setPaying(true, 'Creating invoice…');
  setStatus('Setting up your Lightning invoice — this takes a few seconds.', 'loading');

  try {
    // Same-origin first, so the Cloudflare Worker can attach the city and
    // country it already resolved — a direct call to supabase.co carries
    // no geo at all, which is why every payment showed "Unknown location".
    // Falls straight back to Supabase if the worker is not attached to
    // this domain: a missing location must never block a payment.
    const body = JSON.stringify({ slug, amount });
    let res;
    try {
      res = await fetch('/api/create-invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });
      if (res.status === 404 || res.status === 405) throw new Error('proxy unavailable');
    } catch {
      res = await fetch(`${window.SUPABASE_URL}/functions/v1/create-invoice`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });
    }
    const result = await res.json();

    if (!res.ok){
      setStatus(result.error || 'Something went wrong. Please try again.', 'err');
      setPaying(false, 'Continue to payment');
      return;
    }

    // sessionStorage is only a cache so the invoice page can paint the QR
    // before its own round trip finishes. The id in the URL is what really
    // identifies the invoice, so the link survives a refresh, a closed tab,
    // or being opened on another device.
    sessionStorage.setItem('invoiceSession', JSON.stringify({
      paymentId: result.paymentId,
      payCode: result.payCode,
      payUrl: result.payUrl,
      returnUrl: window.location.pathname,
    }));
    window.location.href = '/invoice-cpay-v2.html?id=' + encodeURIComponent(result.paymentId) + '&wallet=' + encodeURIComponent(window.CPAY_WALLET_MODE || 'all_wallets') + '&theme=' + encodeURIComponent(window.CPAY_INVOICE_DESIGN || window.CPAY_LAYOUT);
  } catch (e){
    console.error('create-invoice failed:', e);
    setStatus('Network error — please check your connection and try again.', 'err');
    setPaying(false, 'Continue to payment');
  }
}
    </script>
  </body>
</html>
