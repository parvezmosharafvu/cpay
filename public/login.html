<script src="config.js"></script><script src="theme.js"></script><script src="app.js"></script><script src="turnstile.js"></script><script src="oauth.js"></script><script src="mfa.js"></script>
</head>
<body class="auth">
  <a class="skip-link" href="#loginCard">Skip to form</a>
  <main class="auth-card">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
    <div class="card" id="loginCard">
      <h1>Log in</h1>
      <p class="sub">Welcome back to your CPAY dashboard.</p>
      <div data-oauth hidden>
        <button class="btn oauth-btn block lg" id="googleBtn" type="button"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
        <div class="or-divider" role="separator"><span>or</span></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><div class="label-row"><label for="password">Password</label><button class="link-btn" id="forgotBtn" type="button">Forgot password?</button></div><input id="password" type="password" autocomplete="current-password" required></div>
      <div id="captchaBox" class="captcha-box"></div>
      <button class="btn primary block lg" id="submitBtn" type="button">Log in</button>
      <div class="alert alert-danger" id="errorMsg" role="alert" hidden></div>
      <div class="alert alert-success" id="okMsg" role="status" hidden></div>
      <div class="notice" id="confirmBox" hidden>
        <p><strong>Confirm your email first.</strong> Open the link we sent when you signed up. It can take a few minutes; check spam too.</p>
        <button class="btn ghost block" id="resendConfirmBtn" type="button">Send the confirmation email again</button>
      </div>
    </div>
    <p class="foot">No account? <a href="register.html">Create one</a></p>
  </main>
<script>
const errEl = () => document.getElementById('errorMsg');
const okEl = () => document.getElementById('okMsg');
function showErr(t){ const e=errEl(); e.textContent=t; e.hidden=false; okEl().hidden=true; }
function showOk(t){ const o=okEl(); o.textContent=t; o.hidden=false; errEl().hidden=true; }
const params = new URLSearchParams(location.search);
const arrivedConfirmed = params.get('confirmed') === '1';
const arrivedGoogle = params.get('via') === 'google';
const CONFIRM_REDIRECT = `${location.origin}/login.html?confirmed=1`;
// An account with an authenticator finishes signing in with its code (aal2).
// Cancelling, or too many wrong codes, signs out again, so a reload shows the
// form instead of prompting in a loop.
async function finishSecondStep(){
  if (!window.cpayMfa) return true;
  if (await window.cpayMfa.ensureAal2('Enter the 6-digit code from your authenticator app to finish signing in.')) return true;
  await window.supabaseClient.auth.signOut();
  showErr('Sign-in not finished: the authentication code was not confirmed.');
  const btn = document.getElementById('submitBtn'); if (btn) btn.disabled = false;
  return false;
}
async function go(id){
  if (!(await finishSecondStep())) return;
  const { data } = await window.supabaseClient.from('profiles').select('role,account_status').eq('id', id).single();
  if (data?.account_status && data.account_status !== 'active'){
    await window.supabaseClient.auth.signOut();
    const labels = {pending:'Your account is waiting for admin approval. You can log in once it is approved.', rejected:'Application was not approved.', suspended:'Account suspended.'};
    if (data.account_status === 'pending' && (arrivedConfirmed || arrivedGoogle)) showOk((arrivedConfirmed ? 'Email confirmed. ' : 'Signed in with Google. ') + labels.pending);
    else showErr(labels[data.account_status] || 'Account is not active.');
    const btn = document.getElementById('submitBtn'); if (btn) btn.disabled = false;
    return;
  }
  location.href = roleHome(data?.role);
}
document.getElementById('submitBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  errEl().hidden=true; okEl().hidden=true;
  if (!email || !password){ showErr('Enter email and password.'); return; }
  const btn = document.getElementById('submitBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const done = () => { btn.disabled = false; btn.textContent = 'Log in'; };
  // Supabase Auth CAPTCHA: a fresh Turnstile token for every attempt.
  let captcha;
  btn.textContent = 'Checking…';
  try { captcha = await window.cpayCaptchaOptions('login', { container: document.getElementById('captchaBox') }); }
  catch (te) { showErr(te.message || 'Verification failed. Try again.'); done(); return; }
  btn.textContent = 'Logging in…';
  try {
    const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password, options: captcha });
    if (error && (error.code === 'email_not_confirmed' || /email not confirmed/i.test(error.message || ''))) {
      errEl().hidden = true; document.getElementById('confirmBox').hidden = false; done(); return;
    }
    if (error){ showErr(window.cpayIsCaptchaError(error) ? window.CPAY_CAPTCHA_MESSAGE : error.message); done(); return; }
    await go(data.user.id);
  } catch (e) {
    showErr('Could not reach the server. Check your connection and try again.');
    done();
  }
};
// Never says whether an account exists for the email (auth-link.js).
document.getElementById('forgotBtn').onclick = async () => {
  const btn = document.getElementById('forgotBtn');
  if (btn.disabled) return;
  const email = document.getElementById('email').value.trim();
  if (!email){ showErr('Enter your email first, then tap Forgot password.'); document.getElementById('email').focus(); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  const r = await window.cpayResetRequest.requestReset(email, { container: document.getElementById('captchaBox') });
  if (r !== 'sent'){
    btn.disabled = false; btn.textContent = 'Forgot password?';
    showErr(r === 'invalid' ? 'Enter a valid email address.'
      : r === 'captcha' ? window.CPAY_CAPTCHA_MESSAGE
      : 'Could not reach the server. Check your connection and try again.');
    return;
  }
  showOk(window.cpayResetRequest.SENT);
  window.cpayResetRequest.cooldown(btn, 'Forgot password?');
};
// Sign-up confirmation email again (Supabase Auth /resend, CAPTCHA-protected).
// Same answer whether or not the address has a pending sign-up.
document.getElementById('resendConfirmBtn').onclick = async () => {
  const btn = document.getElementById('resendConfirmBtn');
  if (btn.disabled) return;
  const email = document.getElementById('email').value.trim();
  if (!email){ showErr('Enter your email first.'); return; }
  btn.disabled = true;
  let captcha = {};
  try { captcha = await window.cpayCaptchaOptions('resend', { container: document.getElementById('captchaBox') }); }
  catch (te) { showErr(te.message || 'Verification failed. Try again.'); btn.disabled = false; return; }
  let error = null;
  try {
    ({ error } = await window.supabaseClient.auth.resend({ type: 'signup', email, options: { emailRedirectTo: CONFIRM_REDIRECT, ...captcha } }));
  } catch (e) { error = { name: 'AuthRetryableFetchError' }; }
  if (error && (error.name === 'AuthRetryableFetchError' || error.status === 0)) { showErr('Could not reach the server. Check your connection and try again.'); btn.disabled = false; return; }
  if (error && window.cpayIsCaptchaError(error)) { showErr(window.CPAY_CAPTCHA_MESSAGE); btn.disabled = false; return; }
  showOk('If that address has an account waiting for confirmation, a new link is on its way. Check spam too.');
  window.cpayResetRequest.cooldown(btn, 'Send the confirmation email again');
};
document.getElementById('password').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('submitBtn').click(); });
window.addEventListener('DOMContentLoaded', async () => {
  if (window.applyDomainTheme) await applyDomainTheme();
  if (params.get('reset') === 'done') showOk('Password updated. Log in with your new password.');
  if (arrivedConfirmed) showOk('Email confirmed. Log in to continue.');
  const link = window.cpayAuthLink || {};
  if (link.error) showErr(arrivedGoogle ? 'Google sign-in did not finish. Try again, or use your email and password.' : 'That link no longer works. Log in, or ask for a new email below.');
  if (window.cpayOAuth) window.cpayOAuth.wire(document.getElementById('googleBtn'), showErr);
  const { data:{ session } } = await window.supabaseClient.auth.getSession();
  if (session) await go(session.user.id);
});
</script>
</body>
</html>
