<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CPAY creator storefront">
<title>CPAY Store</title>
<link rel="icon" href="/favicon-site.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
</head>
<body class="store">
<main class="wrap" style="max-width:860px">
  <nav class="nav"><a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a></nav>
  <section class="store-hero">
    <div class="merchant-avatar" id="avatar">$</div>
    <h1 id="name">Loading…</h1>
    <p id="tagline">Choose a payment option</p>
    <p id="bio" class="faint"></p>
    <button id="share" class="btn ghost" type="button" style="margin-top:14px" hidden>Share store</button>
  </section>
  <section id="grid" class="store-grid"></section>
  <div id="state" class="store-empty">Loading storefront…</div>
  <footer class="site" style="margin-top:40px;text-align:center">Powered by CPAY</footer>
</main>
<script>
const sb=window.supabaseClient,params=new URLSearchParams(location.search),uid=params.get('u');
// window.name is a built-in string, so every element is looked up explicitly.
const [avatar,name,tagline,bio,share,grid,state]=['avatar','name','tagline','bio','share','grid','state'].map(id=>document.getElementById(id));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
  if(!uid){state.textContent='Store not found.';return}
  const {data,error}=await sb.rpc('get_public_store',{p_user_id:uid});
  if(error||!data?.length){state.textContent='Store not found or unavailable.';return}
  const r=data[0];
  document.title=(r.display_name||'CPAY creator')+' · CPAY';
  // store_theme (midnight, snow, glass, sunset) maps onto the shared checkout designs.
  setDesign(r.theme||'midnight');
  if(/^#[0-9a-f]{6}$/i.test(r.accent||''))document.documentElement.style.setProperty('--merchant-accent',r.accent);
  name.textContent=r.display_name||'CPAY creator';
  tagline.textContent=r.tagline||'Choose a payment option';
  bio.textContent=r.bio||'';bio.style.display=r.bio?'block':'none';
  if(r.avatar_url){const img=document.createElement('img');img.src=r.avatar_url;img.alt=r.display_name||'Creator';avatar.textContent='';avatar.appendChild(img);}
  else avatar.textContent=(r.display_name||'$').trim().charAt(0).toUpperCase()||'$';
  const links=Array.isArray(r.links)?r.links:[];
  state.style.display='none';
  grid.innerHTML=links.length?links.map(l=>`<article class="card"><h3>${esc(l.display_name||l.slug)}</h3><div class="faint mono">/${esc(l.slug)}</div><a class="btn primary block" href="/${encodeURIComponent(l.slug)}">${esc(r.cta||'Pay now')}</a></article>`).join(''):'<div class="store-empty">No active payment links yet.</div>';
  share.hidden=false;
  share.onclick=async()=>{const url=location.href;if(navigator.share)try{await navigator.share({title:r.display_name||'CPAY Store',text:r.tagline||'Payment options',url})}catch{}else{try{await navigator.clipboard.writeText(url);share.textContent='Store link copied';setTimeout(()=>share.textContent='Share store',1800)}catch{}}};
})();
</script>
</body>
</html>
