# ============================================================
# CPAY — pre-merge verification
# ============================================================
# Catches the classes of mistake this project has actually hit:
#
#   * a migration that fails to apply (the 42P13 return-type error, which
#     rolled back a whole file and left pages calling functions that did
#     not exist)
#   * a migration numbered the same as one already applied
#   * an edge function that does not TYPE-CHECK — esbuild strips types
#     without checking them, so it happily built code deno rejects
#   * a page whose <script> has a syntax error, or that references an
#     element id or handler that is not there
#   * an rpc() call whose arguments do not match the SQL definition
#   * customer data committed by accident
#
# Every one of these was found by hand at some point. This runs them on
# every push instead.
# ============================================================

name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    # Blocking again. ci/bootstrap.sql now provides everything the
    # migrations reach for — the supabase_realtime publication was the
    # last missing piece, and it is what stopped the run at migration 5
    # of 48. A migration that will not apply to an empty database is
    # exactly the failure this job exists to catch, so it should fail
    # the build.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4

      - name: Migration numbers are unique
        run: |
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration numbers: $dupes"
            exit 1
          fi
          echo "All migration numbers are unique."

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Bootstrap a Supabase-shaped database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/bootstrap.sql

      - name: Apply every migration in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── $(basename "$f")"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "All migrations applied cleanly to an empty database."

      - name: Preserve receipt history while restoring settlement behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/lightning_receipt_rollback_test.sql

      - name: Profile updates stay within the authenticated allowlist
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/profile_update_whitelist_test.sql

      - name: revenue_desk() is admins and service role only
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/revenue_desk_access_test.sql

      - name: Two account types, freelancer and admin (20261005020000)
        env:
          PGPASSWORD: postgres
        run: |
          # No reseller role, tables, columns, triggers, functions or
          # settings left; sign-up, approval and role changes only make
          # freelancers and admins; link pricing has no lock and no team
          # price; withdrawal fee = own override, else the global default;
          # admin_request_withdrawal_for is admin-only and keeps every
          # withdrawal check; own payments and marks, admin tools, lockout
          # guards and the invoice page still work. Runs again on the
          # default-privileges database below. BEGIN/ROLLBACK.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/role_removal_test.sql
          # A pending application approved by an active admin is exactly an
          # active freelancer (no reseller code, no extra privilege); a
          # suspended admin or a freelancer cannot decide one.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/account_approval_test.sql

      - name: Production drift fixes (20261004020000), on the schema before the reseller removal
        env:
          PGPASSWORD: postgres
        run: |
          # Storefront (public fields, active accounts, anon), payout wallets
          # (own-rows RLS, audited admin RPC, no anon), the D4 price lock,
          # nobody changes their own role/status, get_my_analytics and
          # telegram_context grants. Then the same checks after putting the
          # database back into PRODUCTION's pre-migration shape and applying
          # the migration twice. BEGIN/ROLLBACK.
          #
          # These test the historical migration 20261004020000, which
          # re-applies itself and seeds resellers and the price lock, so
          # they run on databases migrated up to, not including,
          # 20261005020000 (the reseller removal); production passes through
          # that state too. The final schema is covered by
          # ci/role_removal_test.sql.
          for db in driftcheck driftpriv; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "create database $db"
            psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f ci/bootstrap.sql
            [ $db = driftpriv ] && psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f ci/supabase_default_privileges.sql
            for f in supabase/migrations/*.sql; do
              n=$(basename "$f" | cut -d_ -f1)
              [ ${#n} -eq 14 ] && [ "$n" -ge 20261005020000 ] && continue
              psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f "$f"
            done
            psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -f ci/production_drift_test.sql
            psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -f ci/production_drift_from_production_state_test.sql
          done

      - name: Receipt log (F1 PR 1) records only, settlement unchanged
        env:
          PGPASSWORD: postgres
        run: |
          # Backfill from the real pre-migration history (reconciliation live,
          # then archived and restored), settle_breez_payment() byte-identical,
          # the record function's outcomes and payload allowlist, and the
          # grants: anon and authenticated cannot read, write or execute.
          # BEGIN/ROLLBACK.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/lightning_receipt_log_test.sql

      - name: anon and authenticated can only execute allowlisted SECURITY DEFINER functions
        env:
          PGPASSWORD: postgres
        run: |
          # A separate database with Supabase's default privileges, so the
          # check sees the grants production has. The main database above
          # is not touched.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c 'create database privcheck'
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -q -f ci/bootstrap.sql
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -q -f ci/supabase_default_privileges.sql
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -f ci/anon_rpc_allowlist.sql
          # The same database for the authenticated role: internal helpers
          # are service-role only, and the SECURITY DEFINER functions a
          # signed-in user can call must match the reviewed list in
          # ci/authenticated_rpc_allowlist.sql exactly (plus a source-text
          # tripwire, which is not an authorization proof).
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -f ci/authenticated_rpc_check.sql
          # Behaviour: every listed function called by two non-owner
          # signed-in users must refuse, or return none of the victim's data
          # and leave the victim's rows unchanged.
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -f ci/authenticated_rpc_sweep_test.sql
          # The account-type checks again, with production's grants. (The
          # drift fixes with production's grants run in the drift step above.)
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -f ci/role_removal_test.sql
          psql -h localhost -U postgres -d privcheck -v ON_ERROR_STOP=1 -f ci/account_approval_test.sql
          # A suspended admin, with production's grants, before and after
          # 20261005020000: every withdrawal, fee, wallet and account probe
          # (including the new admin_request_withdrawal_for) is refused
          # after, nothing is allowed after that was refused before, and an
          # active admin is allowed the admin probes (positive control).
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c 'create database suspcheck'
          psql -h localhost -U postgres -d suspcheck -v ON_ERROR_STOP=1 -q -f ci/bootstrap.sql
          psql -h localhost -U postgres -d suspcheck -v ON_ERROR_STOP=1 -q -f ci/supabase_default_privileges.sql
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | cut -d_ -f1)
            [ ${#n} -eq 14 ] && [ "$n" -ge 20261005020000 ] && continue
            psql -h localhost -U postgres -d suspcheck -v ON_ERROR_STOP=1 -q -f "$f"
          done
          ci/suspended_admin_compare.sh suspcheck privcheck

      - name: Runtime regression — overpayment cap and message soft-delete
        env:
          PGPASSWORD: postgres
        run: |
          # Exercises 0050's two fixes at the data level, not just syntax:
          # a settlement far above amount_requested must be rejected, and
          # clearing a thread must hide rows rather than delete them. Runs
          # inside BEGIN/ROLLBACK against the database the migrations were
          # just applied to, so it leaves nothing behind.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/cloudai_regression.sql

      - name: Dashboard data layer and business day (re-apply from 20261005010000)
        env:
          PGPASSWORD: postgres
        run: |
          # Every migration from 20261005010000 on must survive a second
          # apply, then the RPCs are checked with seeded payments either side
          # of the 17:00 Dhaka cutoff, the 10-link ceiling, who-sees-whom,
          # the daily withdrawal limit and the profile card. BEGIN/ROLLBACK.
          #
          # This used to re-apply 0096 onward. 20261005010000 removed the
          # reseller commission columns forward-only, and SQL-language
          # function bodies in 0096, 0102 and 20261004010000 are checked
          # against columns that no longer exist, so those historical files
          # cannot run a second time on the current schema (they still apply
          # in order to an empty database, which the step above proves). The
          # re-apply now covers the cleanup migrations, which are written to
          # be idempotent. Old files apply once, in order, as in production.
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | cut -d_ -f1)
            [ ${#n} -eq 14 ] && [ "$n" -ge 20261005010000 ] || continue
            echo "── re-apply $(basename "$f")"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/dashboards_test.sql

      - name: Commission removal (20261005010000) keeps balances and aborts on commission data
        env:
          PGPASSWORD: postgres
        run: |
          # Two throwaway databases migrated up to, not including,
          # 20261005010000 (the files before it, in order).
          for db in balcheck abortcheck; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "create database $db"
            psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f ci/bootstrap.sql
            for f in supabase/migrations/*.sql; do
              n=$(basename "$f" | cut -d_ -f1)
              [ ${#n} -eq 14 ] && [ "$n" -ge 20261005010000 ] && continue
              psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done
          # Accounts without commission: every balance, dashboard day and
          # stamped platform fee identical before and after the migration;
          # a new settlement still pays the platform fee.
          psql -h localhost -U postgres -d balcheck -v ON_ERROR_STOP=1 -f ci/commission_removal_before.sql
          psql -h localhost -U postgres -d balcheck -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261005010000_remove_reseller_commission.sql
          psql -h localhost -U postgres -d balcheck -v ON_ERROR_STOP=1 -f ci/commission_removal_after.sql
          # Commission present (a stamped payment, then a profile override):
          # the migration aborts and changes nothing; once none is left it
          # applies, twice.
          ci/commission_removal_abort_test.sh abortcheck

      - name: Reseller role removal (20261005020000) keeps balances and aborts on reseller data
        env:
          PGPASSWORD: postgres
        run: |
          # Two throwaway databases migrated up to, not including,
          # 20261005020000.
          for db in rolecheck roleabort; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "create database $db"
            psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f ci/bootstrap.sql
            for f in supabase/migrations/*.sql; do
              n=$(basename "$f" | cut -d_ -f1)
              [ ${#n} -eq 14 ] && [ "$n" -ge 20261005020000 ] && continue
              psql -h localhost -U postgres -d $db -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done
          # A reseller account with its own links, payments, wallet and
          # withdrawals, and freelancers with and without their own fee:
          # every balance, dashboard day, payment, withdrawal, link cost,
          # profile setting and resolved withdrawal fee identical after the
          # migration; the reseller is a freelancer, withdraws by itself,
          # an admin can withdraw for it, and it still gets paid.
          psql -h localhost -U postgres -d rolecheck -v ON_ERROR_STOP=1 -f ci/role_removal_before.sql
          psql -h localhost -U postgres -d rolecheck -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261005020000_remove_reseller_role.sql
          psql -h localhost -U postgres -d rolecheck -v ON_ERROR_STOP=1 -f ci/role_removal_after.sql
          # Each precondition on its own (team member, affiliate code, lock,
          # team cost, assignment, notice, team message, Telegram group, team
          # fee, self-withdraw switch, pending reseller application, owned
          # domain): the migration aborts and changes nothing; once none is
          # left it applies, twice.
          ci/role_removal_abort_test.sh roleabort

      - name: Telegram messages (0106)
        env:
          PGPASSWORD: postgres
        run: |
          # One settled-payment message per payment to the admin group, no
          # reseller groups or reseller daily close left, re-runs that queue
          # nothing, and the sender's claim/finish rules. BEGIN/ROLLBACK.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ci/telegram_test.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Payment service against the migrated database
        working-directory: payment-service
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          # Ledger (each payment credited once), withdrawals (one send per
          # quote, refunds once), the 0105 balance guard under concurrency,
          # config, and the whole service over HTTP with a fake SDK,
          # including graceful shutdown. Files run one at a time: a service
          # start reconciles every 'sending' withdrawal in the database.
          npm ci --no-audit --no-fund
          npm test

      - name: Previous payment service (main) against the new schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          # Old service, new migration: the payment service as it is on main
          # runs its own tests against this branch's migrated database, so a
          # deploy order of "migration first, service later" is proven safe.
          # On a push to main this compares main with itself.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          mkdir -p /tmp/previous
          git archive origin/main payment-service | tar -x -C /tmp/previous
          cd /tmp/previous/payment-service
          npm ci --no-audit --no-fund
          npm test

  functions:
    name: Edge functions type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: deno check every function
        run: |
          fail=0
          for d in supabase/functions/*/; do
            [ -f "${d}index.ts" ] || continue
            echo "── ${d}index.ts"
            deno check "${d}index.ts" || fail=1
          done
          exit $fail
      - name: auth-settings against a mock Management API
        # Local mock servers only: no call to api.supabase.com, no real token.
        # Covers the admin check (a non-admin is refused before any
        # Management API call), the mailer_autoconfirm mapping, the audit
        # row, and that neither the token nor the auth config's secrets
        # ever reach a response.
        run: deno test --allow-net=127.0.0.1 --allow-env supabase/functions/auth-settings/
      - name: telegram-notify against a mock Telegram API
        # Local mock server only: no message reaches Telegram. Covers the
        # cron secret, message wording and escaping, retry and failure
        # handling, and that the bot token never appears in a result.
        run: deno test --allow-net=127.0.0.1 supabase/functions/telegram-notify/
      - name: deployed-vs-repo drift check (self-test, no secrets)
        # The live comparison needs a Supabase access token, which CI does
        # not hold on purpose; the owner runs it by hand (docs/OPS_DRIFT_2026-10.md).
        # Here the script runs against the production list saved on
        # 2026-10-04: it must flag the three known orphans and nothing else,
        # and pass once they are allowed. This also lists the repo set.
        run: |
          set +e
          out=$(python3 scripts/check_edge_function_drift.py --deployed-json ci/fixtures/deployed_functions_2026-10-04.json)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "expected exit 1 (drift), got $code"; exit 1; }
          [ "$(echo "$out" | grep -c '^  ORPHAN')" -eq 3 ] || { echo "expected exactly 3 orphans"; exit 1; }
          for f in reconcile reseller-digest telegram-report; do echo "$out" | grep -q "ORPHAN    $f " || { echo "missing orphan $f"; exit 1; }; done
          ! echo "$out" | grep -q '^  MISSING' || { echo "a repo function is missing from the fixture"; exit 1; }
          python3 scripts/check_edge_function_drift.py --deployed-json ci/fixtures/deployed_functions_2026-10-04.json \
            --allow reconcile --allow reseller-digest --allow telegram-report

  frontend:
    name: Pages parse and reference real things
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 rather than 20: GitHub now warns that actions targeting
          # Node 20 are deprecated, and node --check behaves identically.
          node-version: '22'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser assets
        run: npm run build
      - name: Static checks
        run: python3 ci/check_frontend.py
      - name: Public copy (README, SECURITY, docs, pages)
        # No payment-processor name, no bKash/Nagad/Binance/bank, no
        # "any Lightning wallet" promise. See ci/check_public_copy.py.
        run: python3 ci/check_public_copy.py
      - name: Frontend HTML escaping regression tests
        run: node --test tests/frontend/app.test.mjs

  hygiene:
    name: Ledger snapshots are where you expect
    runs-on: ubuntu-latest
    # Advisory. Keeping snapshots in this repo is a deliberate choice
    # here — the repository is private, so the exposure is limited to
    # people who already have access to everything else in it.
    #
    # It still reports, because the tradeoff is worth re-reading
    # occasionally: the moment this repo gains a collaborator or is ever
    # made public, those files become the most sensitive thing in it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Report tracked ledger snapshots
        run: |
          if git ls-files | grep -q '^ledger-backups/'; then
            count=$(git ls-files | grep -c '^ledger-backups/')
            echo "NOTE: $count ledger snapshot(s) are tracked in this repository."
            echo
            echo "They contain withdrawal destinations and payment references."
            echo "That is acceptable while this repo stays private and access"
            echo "stays limited to you."
            echo
            echo "Before adding a collaborator, or ever making this public:"
            echo "  1. Create a private repo, e.g. cpay-ledger"
            echo "  2. Supabase > Edge Functions > Secrets:  GITHUB_REPO = cpay-ledger"
            echo "  3. git rm -r --cached ledger-backups/"
            echo "  4. git filter-repo --path ledger-backups/ --invert-paths"
          else
            echo "No ledger snapshots tracked."
          fi
