<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<meta name="color-scheme" content="light">
<title>New password · CPAY</title>
<link rel="icon" type="image/svg+xml" href="/favicon-site.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cpay.css">
<link rel="stylesheet" href="a11y.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="theme.js"></script><script src="app.js"></script>
</head>
<body class="auth">
  <a class="skip-link" href="#resetCard">Skip to form</a>
  <main class="auth-card">
    <a class="brand" href="/login.html"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg></span>CPAY</a>
    <div class="card" id="resetCard">
      <h1>Set a new password</h1>
      <p class="sub">Use the link from your email, then choose a new password.</p>
      <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" aria-describedby="passwordHint" minlength="8" required></div>
      <p class="hint" id="passwordHint">At least 8 characters.</p>
      <div class="field"><label for="password2">Confirm</label><input id="password2" type="password" autocomplete="new-password" required></div>
      <button class="btn primary block lg" id="saveBtn" type="button">Save password</button>
      <div class="alert alert-danger" id="errorMsg" role="alert" hidden></div>
    </div>
    <p class="foot"><a href="login.html">Back to log in</a></p>
  </main>
<script>
function showErr(t){ const e=document.getElementById('errorMsg'); e.textContent=t; e.hidden=false; }
window.addEventListener('DOMContentLoaded', async () => {
  if (window.applyDomainTheme) await applyDomainTheme();
  const { data:{ session } } = await window.supabaseClient.auth.getSession();
  if (!session) showErr('Open the link from the email on this phone. If it expired, request a new one from log in.');
});
document.getElementById('saveBtn').onclick = async () => {
  const a = document.getElementById('password').value;
  const b = document.getElementById('password2').value;
  if (!a || a.length < 8){ showErr('Use at least 8 characters.'); return; }
  if (a !== b){ showErr('The two passwords do not match.'); return; }
  const btn = document.getElementById('saveBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  let error;
  try {
    ({ error } = await window.supabaseClient.auth.updateUser({ password: a }));
  } catch (e) {
    error = { message: 'Could not reach the server. Check your connection and try again.' };
  }
  if (error){ showErr(error.message); btn.disabled = false; return; }
  location.href = 'login.html';
};
</script>
</body>
</html>
